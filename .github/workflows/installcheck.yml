name: installcheck
on: workflow_dispatch
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PROTO_INTEGRATOR_APP_ID }}
          private-key: ${{ secrets.PROTO_INTEGRATOR_PRIVATE_KEY }}
          owner: BuroHappoldEngineeringSandbox
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          echo "installation repositories:"
          gh api installation/repositories --jq '{total_count, repos: [.repositories[].full_name]}'
