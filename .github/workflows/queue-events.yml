name: queue-events
run-name: queue-events ${{ github.event.action }} #${{ github.event.pull_request.number }}
on:
  pull_request:
    types: [dequeued, closed]
    branches: ['lock-*']
permissions:
  contents: read
jobs:
  handle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PROTO_INTEGRATOR_APP_ID }}
          private-key: ${{ secrets.PROTO_INTEGRATOR_PRIVATE_KEY }}
          owner: BuroHappoldEngineeringSandbox
          repositories: proto-installer-mq
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 scripts/mq.py queue-event --pr ${{ github.event.pull_request.number }} --action ${{ github.event.action }}
