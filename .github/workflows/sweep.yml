name: sweep
on:
  repository_dispatch:
    types: [sweep]
  workflow_dispatch: {}
permissions:
  contents: read
# Single instance: one sweep runs, one waits; a newer request replaces the waiting one.
concurrency:
  group: sweep
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PROTO_INTEGRATOR_APP_ID }}
          private-key: ${{ secrets.PROTO_INTEGRATOR_PRIVATE_KEY }}
          owner: BuroHappoldEngineeringSandbox
          repositories: proto-installer-mq
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 scripts/mq.py sweep --policies a,d,e
